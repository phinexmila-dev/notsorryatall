<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KiKiPhone</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/j2G1nTGH/IMG-7813.jpg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="galaxy_link.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="chronicle.js"></script>
    <style>
        /* ===== 极简核心样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        /* 主屏幕 */
        .screen { display: flex; flex-direction: column; height: 100%; }
        .status-bar { height: 40px; padding: 20px 20px 0; display: flex; justify-content: space-between; }
        .main-desktop { flex: 1; padding: 20px; overflow-y: auto; }
        
        /* 网格布局 */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .icon { aspect-ratio: 1; background: rgba(255,255,255,0.1); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
        .icon i { font-size: 32px; }
        .icon span { font-size: 12px; }
        
        /* 应用容器 */
        .app { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; transform: translateX(100%); transition: transform 0.3s; z-index: 10; overflow-y: auto; }
        .app.active { transform: translateX(0); }
        .app-header { padding: 60px 20px 20px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #333; }
        .back-btn { font-size: 24px; cursor: pointer; }
        
        /* 聊天 */
        .chat-list { padding: 20px; }
        .chat-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid #333; cursor: pointer; }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; }
        .chat-name { font-weight: bold; }
        .chat-preview { font-size: 12px; opacity: 0.7; }
        
        /* 消息 */
        .messages { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 18px; }
        .message.user { align-self: flex-end; background: #007AFF; }
        .message.character { align-self: flex-start; background: #333; }
        
        /* 输入栏 */
        .input-bar { display: flex; padding: 10px; gap: 10px; border-top: 1px solid #333; }
        .input-bar input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #1a1a1a; color: #fff; }
        .input-bar button { width: 40px; height: 40px; border-radius: 50%; border: none; background: #007AFF; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

<!-- ===== 桌面 ===== -->
<div class="screen">
    <div class="status-bar">
        <span id="clock"></span>
        <div id="theme-toggle"><i class="ri-heart-line"></i></div>
    </div>

    <div class="main-desktop" id="desktop">
        <div class="grid">
            <div class="icon" id="icon-settings"><i class="ri-settings-3-line"></i><span>设置</span></div>
            <div class="icon" id="icon-chat"><i class="ri-chat-3-line"></i><span>聊天</span></div>
            <div class="icon" id="icon-archive"><i class="ri-contacts-book-line"></i><span>档案</span></div>
            <div class="icon" id="icon-library"><i class="ri-global-line"></i><span>图书馆</span></div>
        </div>
    </div>
</div>

<!-- ===== 设置 ===== -->
<div id="settings-app" class="app">
    <div class="app-header">
        <i class="ri-arrow-left-s-line back-btn"></i>
        <h2>设置</h2>
    </div>
    <div class="chat-list" id="settings-list"></div>
</div>

<!-- ===== 聊天 ===== -->
<div id="chat-app" class="app">
    <div class="app-header">
        <i class="ri-arrow-left-s-line back-btn"></i>
        <h2>对话</h2>
        <i class="ri-add-line" id="new-chat" style="margin-left:auto; cursor:pointer;"></i>
    </div>
    <div class="chat-list" id="chat-list"></div>
</div>

<!-- 聊天详情 -->
<div id="chat-detail" class="app">
    <div class="app-header">
        <i class="ri-arrow-left-s-line back-btn"></i>
        <h2 id="chat-title"></h2>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
        <input type="text" id="chat-input" placeholder="输入消息...">
        <button id="send-btn"><i class="ri-send-plane-fill"></i></button>
    </div>
</div>

<!-- ===== 档案 ===== -->
<div id="archive-app" class="app">
    <div class="app-header">
        <i class="ri-arrow-left-s-line back-btn"></i>
        <h2>档案</h2>
        <i class="ri-add-line" id="add-archive" style="margin-left:auto; cursor:pointer;"></i>
    </div>
    <div class="chat-list" id="archive-list"></div>
</div>

<!-- 档案编辑 -->
<div id="archive-edit" class="app">
    <div class="app-header">
        <i class="ri-arrow-left-s-line back-btn"></i>
        <h2>编辑档案</h2>
    </div>
    <div style="padding:20px; display:flex; flex-direction:column; gap:15px;">
        <input type="text" id="char-name" placeholder="角色姓名" style="padding:12px; background:#1a1a1a; border:none; border-radius:8px; color:#fff;">
        <textarea id="char-bg" placeholder="人设背景" rows="4" style="padding:12px; background:#1a1a1a; border:none; border-radius:8px; color:#fff;"></textarea>
        <button id="save-archive" style="padding:12px; background:#007AFF; border:none; border-radius:8px; color:#fff; cursor:pointer;">保存</button>
    </div>
</div>

<!-- ===== 图书馆 ===== -->
<div id="library-app" class="app">
    <div class="app-header">
        <i class="ri-arrow-left-s-line back-btn"></i>
        <h2>图书馆</h2>
        <i class="ri-add-line" id="add-book" style="margin-left:auto; cursor:pointer;"></i>
    </div>
    <div class="chat-list" id="library-list"></div>
</div>

<!-- 书籍编辑 -->
<div id="book-edit" class="app">
    <div class="app-header">
        <i class="ri-arrow-left-s-line back-btn"></i>
        <h2>编辑书</h2>
    </div>
    <div style="padding:20px; display:flex; flex-direction:column; gap:15px;">
        <input type="text" id="book-title" placeholder="书名" style="padding:12px; background:#1a1a1a; border:none; border-radius:8px; color:#fff;">
        <select id="book-category" style="padding:12px; background:#1a1a1a; border:none; border-radius:8px; color:#fff;">
            <option value="worldview">世界观</option>
            <option value="writing_style">文风</option>
        </select>
        <textarea id="book-content" placeholder="内容" rows="8" style="padding:12px; background:#1a1a1a; border:none; border-radius:8px; color:#fff;"></textarea>
        <button id="save-book" style="padding:12px; background:#007AFF; border:none; border-radius:8px; color:#fff; cursor:pointer;">保存</button>
    </div>
</div>

<!-- 隐藏上传 -->
<input type="file" id="image-uploader" accept="image/*" style="display:none;">

<script>
    // ===== 极简数据库 =====
    const DB = {
        dossiers: [],
        books: [],
        chats: [],
        messages: {},
        
        load() {
            this.dossiers = JSON.parse(localStorage.getItem('dossiers') || '[]');
            this.books = JSON.parse(localStorage.getItem('books') || '[]');
            this.chats = JSON.parse(localStorage.getItem('chats') || '[]');
            this.messages = JSON.parse(localStorage.getItem('messages') || '{}');
        },
        save() {
            localStorage.setItem('dossiers', JSON.stringify(this.dossiers));
            localStorage.setItem('books', JSON.stringify(this.books));
            localStorage.setItem('chats', JSON.stringify(this.chats));
            localStorage.setItem('messages', JSON.stringify(this.messages));
        }
    };
    DB.load();

    // ===== 工具函数 =====
    function showToast(msg) {
        alert(msg); // 简单用alert代替
    }

    function formatTime(timestamp) {
        return new Date(timestamp).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }

    // ===== 导航 =====
    function openApp(appId) {
        document.querySelectorAll('.app').forEach(a => a.classList.remove('active'));
        document.getElementById(appId).classList.add('active');
    }

    function closeApps() {
        document.querySelectorAll('.app').forEach(a => a.classList.remove('active'));
    }

    // ===== 时钟 =====
    function updateClock() {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ===== 主题 =====
    document.getElementById('theme-toggle').onclick = () => {
        document.body.classList.toggle('light-mode');
        document.body.style.background = document.body.classList.contains('light-mode') ? '#fff' : '#000';
        document.body.style.color = document.body.classList.contains('light-mode') ? '#000' : '#fff';
    };

    // ===== 档案 =====
    function renderArchives() {
        const list = document.getElementById('archive-list');
        list.innerHTML = DB.dossiers.map(d => `
            <div class="chat-item" data-id="${d.id}">
                <div class="chat-avatar"></div>
                <div>
                    <div class="chat-name">${d.name}</div>
                    <div class="chat-preview">${d.bg.substring(0,30)}...</div>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('icon-archive').onclick = () => {
        renderArchives();
        openApp('archive-app');
    };

    document.getElementById('add-archive').onclick = () => {
        document.getElementById('char-name').value = '';
        document.getElementById('char-bg').value = '';
        delete document.getElementById('archive-edit').dataset.id;
        openApp('archive-edit');
    };

    document.getElementById('archive-list').onclick = (e) => {
        const item = e.target.closest('.chat-item');
        if (!item) return;
        const id = parseInt(item.dataset.id);
        const d = DB.dossiers.find(d => d.id === id);
        if (d) {
            document.getElementById('char-name').value = d.name;
            document.getElementById('char-bg').value = d.bg;
            document.getElementById('archive-edit').dataset.id = id;
            openApp('archive-edit');
        }
    };

    document.getElementById('save-archive').onclick = () => {
        const name = document.getElementById('char-name').value.trim();
        const bg = document.getElementById('char-bg').value.trim();
        if (!name || !bg) return showToast('请填写完整');

        const id = document.getElementById('archive-edit').dataset.id;
        if (id) {
            const d = DB.dossiers.find(d => d.id === parseInt(id));
            if (d) { d.name = name; d.bg = bg; }
        } else {
            DB.dossiers.push({ id: Date.now(), name, bg, userBg: '' });
        }
        DB.save();
        renderArchives();
        openApp('archive-app');
    };

    // ===== 聊天 =====
    function renderChatList() {
        const list = document.getElementById('chat-list');
        list.innerHTML = DB.chats.map(c => {
            const d = DB.dossiers.find(d => d.id === c.dossierId);
            return `
                <div class="chat-item" data-id="${c.dossierId}">
                    <div class="chat-avatar"></div>
                    <div>
                        <div class="chat-name">${d ? d.name : '未知'}</div>
                        <div class="chat-preview">${c.lastMsg || '...'}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    document.getElementById('icon-chat').onclick = () => {
        renderChatList();
        openApp('chat-app');
    };

    document.getElementById('new-chat').onclick = () => {
        if (DB.dossiers.length === 0) return showToast('请先创建档案');
        const id = DB.dossiers[0].id;
        if (!DB.chats.find(c => c.dossierId === id)) {
            DB.chats.push({ dossierId: id, lastMsg: '新对话' });
            DB.messages[id] = [];
            DB.save();
        }
        renderChatList();
    };

    document.getElementById('chat-list').onclick = (e) => {
        const item = e.target.closest('.chat-item');
        if (!item) return;
        const id = parseInt(item.dataset.id);
        const d = DB.dossiers.find(d => d.id === id);
        document.getElementById('chat-title').textContent = d ? d.name : '聊天';
        document.getElementById('messages').innerHTML = (DB.messages[id] || []).map(m => `
            <div class="message ${m.sender}">${m.content}</div>
        `).join('');
        document.getElementById('chat-detail').dataset.id = id;
        openApp('chat-detail');
    };

    document.getElementById('send-btn').onclick = async () => {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        const id = parseInt(document.getElementById('chat-detail').dataset.id);
        if (!id) return;

        // 用户消息
        if (!DB.messages[id]) DB.messages[id] = [];
        DB.messages[id].push({ sender: 'user', content: text, timestamp: Date.now() });
        
        // 更新UI
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message user';
        msgDiv.textContent = text;
        document.getElementById('messages').appendChild(msgDiv);
        input.value = '';

        // 模拟AI回复
        setTimeout(async () => {
            const reply = `收到：${text}`;
            DB.messages[id].push({ sender: 'character', content: reply, timestamp: Date.now() });
            const replyDiv = document.createElement('div');
            replyDiv.className = 'message character';
            replyDiv.textContent = reply;
            document.getElementById('messages').appendChild(replyDiv);
            
            // 更新会话
            const chat = DB.chats.find(c => c.dossierId === id);
            if (chat) chat.lastMsg = reply;
            DB.save();
        }, 500);

        DB.save();
    };

    // ===== 图书馆 =====
    function renderLibrary() {
        const list = document.getElementById('library-list');
        list.innerHTML = DB.books.map(b => `
            <div class="chat-item" data-id="${b.id}">
                <div>
                    <div class="chat-name">${b.title}</div>
                    <div class="chat-preview">${b.category}</div>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('icon-library').onclick = () => {
        renderLibrary();
        openApp('library-app');
    };

    document.getElementById('add-book').onclick = () => {
        document.getElementById('book-title').value = '';
        document.getElementById('book-category').value = 'worldview';
        document.getElementById('book-content').value = '';
        delete document.getElementById('book-edit').dataset.id;
        openApp('book-edit');
    };

    document.getElementById('library-list').onclick = (e) => {
        const item = e.target.closest('.chat-item');
        if (!item) return;
        const id = parseInt(item.dataset.id);
        const b = DB.books.find(b => b.id === id);
        if (b) {
            document.getElementById('book-title').value = b.title;
            document.getElementById('book-category').value = b.category;
            document.getElementById('book-content').value = b.content;
            document.getElementById('book-edit').dataset.id = id;
            openApp('book-edit');
        }
    };

    document.getElementById('save-book').onclick = () => {
        const title = document.getElementById('book-title').value.trim();
        const category = document.getElementById('book-category').value;
        const content = document.getElementById('book-content').value.trim();
        if (!title || !content) return showToast('请填写完整');

        const id = document.getElementById('book-edit').dataset.id;
        if (id) {
            const b = DB.books.find(b => b.id === parseInt(id));
            if (b) { b.title = title; b.category = category; b.content = content; }
        } else {
            DB.books.push({ id: Date.now(), title, category, content, isGlobal: false });
        }
        DB.save();
        renderLibrary();
        openApp('library-app');
    };

    // ===== 设置 =====
    document.getElementById('icon-settings').onclick = () => {
        document.getElementById('settings-list').innerHTML = `
            <div class="chat-item" id="export-data"><div>导出数据</div></div>
            <div class="chat-item" id="import-data"><div>导入数据</div></div>
            <div class="chat-item" id="clear-data"><div>清除所有数据</div></div>
        `;
        openApp('settings-app');
    };

    document.getElementById('settings-list').onclick = (e) => {
        const id = e.target.closest('.chat-item')?.id;
        if (id === 'export-data') {
            const data = { dossiers: DB.dossiers, books: DB.books, chats: DB.chats, messages: DB.messages };
            const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kiki-backup-${Date.now()}.json`;
            a.click();
        } else if (id === 'import-data') {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        DB.dossiers = data.dossiers || [];
                        DB.books = data.books || [];
                        DB.chats = data.chats || [];
                        DB.messages = data.messages || {};
                        DB.save();
                        showToast('导入成功');
                    } catch (err) {
                        showToast('导入失败');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        } else if (id === 'clear-data') {
            if (confirm('确定清除所有数据？')) {
                localStorage.clear();
                location.reload();
            }
        }
    };

    // ===== 返回按钮 =====
    document.querySelectorAll('.back-btn').forEach(btn => {
        btn.onclick = () => {
            const app = btn.closest('.app');
            if (app.id === 'chat-detail') {
                openApp('chat-app');
            } else {
                closeApps();
            }
        };
    });

    // ===== 初始化 =====
    DB.save();
</script>

</body>
</html>
